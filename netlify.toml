# Netlify configuration for Next.js + Convex app

[build]
  command = "npm run build"
  # Don't set publish - Next.js Runtime handles this automatically

# Next.js plugin for Netlify (handles SSR, routing, etc.)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
