name: Scrape Stock Data

on:
  # Run at 10:00 AM and 3:00 PM Sri Lanka time (UTC+5:30)
  # 10:00 AM SL = 4:30 AM UTC
  # 3:00 PM SL = 9:30 AM UTC (30 min after market close at 2:30 PM)
  schedule:
    - cron: '30 4 * * 1-5'   # 10:00 AM Sri Lanka time (Monday-Friday)
    - cron: '30 9 * * 1-5'   # 3:00 PM Sri Lanka time (Monday-Friday)

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Run stock scraper
        run: npm run scrape
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}

      - name: 📊 Log completion
        run: |
          echo "✅ Stock scraping completed at $(date)"
          echo "🕐 Sri Lanka time: $(TZ='Asia/Colombo' date)"
